<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly III Sankey Generator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f4f6f8; color: #333; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; }
    button { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; }
    button:hover { background: #059669; }
    textarea { width: 100%; height: 250px; font-family: monospace; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-secondary { background: #4b5563; }
    .btn-secondary:hover { background: #374151; }
    .badge { display: inline-block; padding: 4px 8px; font-size: 12px; background: #d1fae5; color: #065f46; border-radius: 4px; margin-bottom: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Firefly III Sankey Generator</h2>
    <div id="envBadge" class="badge" style="display: none;">✓ Connected using container environment variables</div>
    
    <form id="sankeyForm">
      <div id="credentialsFields">
        <div class="form-group">
          <label>Firefly III URL</label>
          <input type="text" id="url" placeholder="https://firefly.yourdomain.com">
        </div>
        <div class="form-group">
          <label>Personal Access Token</label>
          <input type="password" id="token" placeholder="eyJ0eXAiOiJKV1QiLC...">
        </div>
      </div>

      <div style="display: flex; gap: 16px;">
        <div class="form-group" style="flex: 1;">
          <label>Start Date</label>
          <input type="date" id="startDate">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>End Date</label>
          <input type="date" id="endDate">
        </div>
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" id="withAssets">
        <label for="withAssets" style="margin: 0;">Include Asset Accounts & Transfers</label>
      </div>
      <button type="submit" id="submitBtn">Generate Diagram Data</button>
    </form>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h3>Generated Output</h3>
    <textarea id="output" readonly></textarea>
    <div class="actions">
      <button class="btn-secondary" onclick="copyOutput()">Copy Text</button>
      <button onclick="openSankeyMatic()">Open in SankeyMatic</button>
    </div>
  </div>

  <script>
    let hasEnvConfig = false;

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (data.hasEnvConfig) {
          hasEnvConfig = true;
          document.getElementById('envBadge').style.display = 'inline-block';
          document.getElementById('credentialsFields').style.display = 'none';
        }
      } catch (err) {
        console.error('Failed to load server config', err);
      }
    });

    document.getElementById('sankeyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Generating...';
      btn.disabled = true;

      const payload = {
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        withAssets: document.getElementById('withAssets').checked,
        format: 'sankeymatic'
      };

      if (!hasEnvConfig) {
        payload.url = document.getElementById('url').value;
        payload.token = document.getElementById('token').value;
      }

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          document.getElementById('output').value = data.result;
          document.getElementById('resultCard').style.display = 'block';
        }
      } catch (err) {
        alert('Failed to connect to server: ' + err.message);
      } finally {
        btn.innerText = 'Generate Diagram Data';
        btn.disabled = false;
      }
    });

    function copyOutput() {
      const output = document.getElementById('output');
      output.select();
      navigator.clipboard.writeText(output.value);
      alert('Copied to clipboard!');
    }

    function openSankeyMatic() {
      window.open('https://sankeymatic.com/build/', '_blank');
    }
  </script>
</body>
</html>
