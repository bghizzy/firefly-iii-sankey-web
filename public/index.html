<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly III Sankey Generator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem; background: #121212; color: #e0e0e0; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #333; }
    .status-bar { padding: 0.75rem 1rem; border-radius: 6px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .status-online { background: #1b3a2b; color: #4caf50; border: 1px solid #2e7d32; }
    .status-offline { background: #3a1b1b; color: #f44336; border: 1px solid #c62828; }
    .status-checking { background: #3a321b; color: #ffeb3b; border: 1px solid #fbc02d; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
    input[type="date"] { padding: 0.5rem; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; }
    .checkbox-group { display: flex; gap: 1rem; margin: 1rem 0; }
    button { background: #2196f3; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #1976d2; }
    textarea { width: 100%; height: 350px; background: #0a0a0a; color: #00ff66; font-family: monospace; padding: 1rem; border: 1px solid #333; border-radius: 4px; box-sizing: border-box; }
    .actions { margin-top: 1rem; display: flex; gap: 1rem; align-items: center; }
    .copy-success { color: #4caf50; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Firefly III Sankey Generator</h2>
    
    <!-- Connection Indicator -->
    <div id="status" class="status-bar status-checking">
      <span id="status-text">Checking Firefly III Connection...</span>
      <button onclick="checkHealth()" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;">Re-check</button>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Start Date:</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group">
        <label>End Date:</label>
        <input type="date" id="endDate">
      </div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="withAssets"> Include Asset Accounts</label>
        <label><input type="checkbox" id="withAccounts"> Detailed Revenue/Expense Accounts</label>
      </div>
      <button onclick="generateSankey()">Generate Sankey Data</button>
    </div>

    <div class="card">
      <h3>SankeyMatic Output</h3>
      <textarea id="output" readonly placeholder="Generated output will appear here..."></textarea>
      <div class="actions">
        <button onclick="copyToClipboard()">Copy to Clipboard</button>
        <span id="copyMsg" class="copy-success">✓ Copied! Ready to paste into SankeyMatic.</span>
        <a href="https://sankeymatic.com/build/" target="_blank" style="color: #64b5f6; margin-left: auto;">Open SankeyMatic.com ↗</a>
      </div>
    </div>
  </div>

  <script>
    async function checkHealth() {
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      statusEl.className = 'status-bar status-checking';
      statusText.innerText = 'Checking Firefly III Connection...';

      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (data.connected) {
          statusEl.className = 'status-bar status-online';
          statusText.innerText = `● Connected to Firefly III (v${data.version})`;
        } else {
          statusEl.className = 'status-bar status-offline';
          statusText.innerText = `✕ Connection Failed: ${data.message}`;
        }
      } catch (err) {
        statusEl.className = 'status-bar status-offline';
        statusText.innerText = '✕ Server Error checking health connection';
      }
    }

    async function generateSankey() {
      const output = document.getElementById('output');
      const copyMsg = document.getElementById('copyMsg');
      copyMsg.style.display = 'none';
      output.value = 'Generating... please wait...';

      const payload = {
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        withAssets: document.getElementById('withAssets').checked,
        withAccounts: document.getElementById('withAccounts').checked
      };

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.error) {
          output.value = `Error:\n${data.error}`;
        } else {
          output.value = data.result;
        }
      } catch (err) {
        output.value = `Request failed: ${err.message}`;
      }
    }

    async function copyToClipboard() {
      const output = document.getElementById('output');
      const copyMsg = document.getElementById('copyMsg');

      if (!output.value || output.value.startsWith('Generating') || output.value.startsWith('Error')) return;

      try {
        await navigator.clipboard.writeText(output.value);
        copyMsg.style.display = 'inline';
        setTimeout(() => { copyMsg.style.display = 'none'; }, 3000);
      } catch (err) {
        output.select();
        document.execCommand('copy');
        copyMsg.style.display = 'inline';
        setTimeout(() => { copyMsg.style.display = 'none'; }, 3000);
      }
    }

    // Check health on page load
    checkHealth();
  </script>
</body>
</html>
