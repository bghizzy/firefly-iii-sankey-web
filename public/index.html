<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly III Sankey Web</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input[type="text"], input[type="date"], textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin: 1.5rem 0; }
    .checkbox-group label { margin-bottom: 0; font-weight: normal; cursor: pointer; }
    button { padding: 0.75rem 1.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0052a3; }
    textarea { height: 300px; font-family: monospace; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Firefly III Sankey Diagram Generator</h1>
  
  <form id="sankeyForm">
    <div class="form-group">
      <label for="startDate">Start Date</label>
      <input type="date" id="startDate" required>
    </div>

    <div class="form-group">
      <label for="endDate">End Date</label>
      <input type="date" id="endDate" required>
    </div>

    <!-- Toggle Checkbox -->
    <div class="checkbox-group">
      <input type="checkbox" id="excludePaycheck" name="excludePaycheck">
      <label for="excludePaycheck">Exclude "Other - Paycheck" from chart output</label>
    </div>

    <button type="submit" id="generateBtn">Generate Sankey Data</button>
  </form>

  <div class="form-group" style="margin-top: 2rem;">
    <label for="output">SankeyMatic Output</label>
    <textarea id="output" readonly placeholder="Generated Sankey data will appear here..."></textarea>
  </div>

  <script>
    document.getElementById('sankeyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('generateBtn');
      const output = document.getElementById('output');
      btn.disabled = true;
      btn.innerText = 'Generating...';
      output.value = '';

      const payload = {
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        excludePaycheck: document.getElementById('excludePaycheck').checked
      };

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.error) {
          output.value = `Error: ${data.error}\n${data.details || ''}`;
        } else {
          output.value = data.result;
        }
      } catch (err) {
        output.value = `Request failed: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Generate Sankey Data';
      }
    });
  </script>
</body>
</html>
